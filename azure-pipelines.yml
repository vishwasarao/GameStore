# Azure DevOps Pipeline for GameStore API
# Builds, tests, containerizes, and deploys the application

trigger:
  branches:
    include:
      - main
  paths:
    exclude:
      - README.md
      - docs/**

pool:
  name: Default  # Your self-hosted agent pool

variables:
  # Azure Configuration
  azureServiceConnection: 'Azure-ServiceConnection' # Update with your service connection name
  azureSubscription: '5426beb5-62d6-42e4-978f-4decb7b1bd17'
  resourceGroup: 'rg-gamestore-api-dev'
  location: 'uksouth'
  
  # Container Registry
  containerRegistry: 'gamestore-dev-xyvvgcieoq3dw-registry.azurecr.io'
  imageName: 'gamestore-api'
  imageTag: '$(Build.BuildId)'
  
  # Container App
  containerAppName: 'gamestore-dev-xyvvgcieoq3dw-api'
  
  # .NET Configuration
  buildConfiguration: 'Release'
  dotnetVersion: '10.0.x'

stages:
  - stage: Build
    displayName: 'Build and Test'
    jobs:
      - job: BuildJob
        displayName: 'Build .NET Application'
        steps:
          - checkout: self
            displayName: 'Checkout Code'

          - task: UseDotNet@2
            displayName: 'Install .NET SDK'
            inputs:
              version: $(dotnetVersion)
              includePreviewVersions: true

          - script: |
              dotnet restore GameStore.Api/GameStore.Api.csproj
            displayName: 'Restore NuGet Packages'

          - script: |
              dotnet build GameStore.Api/GameStore.Api.csproj \
                --configuration $(buildConfiguration) \
                --no-restore
            displayName: 'Build Application'

          # Uncomment when you have tests
          # - script: |
          #     dotnet test GameStore.Tests/GameStore.Tests.csproj \
          #       --configuration $(buildConfiguration) \
          #       --no-build \
          #       --logger trx \
          #       --collect:"XPlat Code Coverage"
          #   displayName: 'Run Tests'

          # - task: PublishTestResults@2
          #   displayName: 'Publish Test Results'
          #   inputs:
          #     testResultsFormat: 'VSTest'
          #     testResultsFiles: '**/*.trx'

          - script: |
              dotnet publish GameStore.Api/GameStore.Api.csproj \
                --configuration $(buildConfiguration) \
                --output $(Build.ArtifactStagingDirectory)/publish \
                --no-build
            displayName: 'Publish Application'

          - task: PublishBuildArtifacts@1
            displayName: 'Publish Build Artifacts'
            inputs:
              PathtoPublish: '$(Build.ArtifactStagingDirectory)/publish'
              ArtifactName: 'drop'

  - stage: ContainerBuild
    displayName: 'Build and Push Container'
    dependsOn: Build
    condition: succeeded()
    jobs:
      - job: DockerBuild
        displayName: 'Build Docker Image'
        steps:
          - checkout: self
            displayName: 'Checkout Code'

          - task: Docker@2
            displayName: 'Build Docker Image'
            inputs:
              command: build
              repository: $(imageName)
              dockerfile: 'Dockerfile'
              tags: |
                $(imageTag)
                latest

          - task: AzureCLI@2
            displayName: 'Login to ACR'
            inputs:
              azureSubscription: $(azureServiceConnection)
              scriptType: 'bash'
              scriptLocation: 'inlineScript'
              inlineScript: |
                az acr login --name $(echo $(containerRegistry) | cut -d'.' -f1)

          - task: Docker@2
            displayName: 'Tag Docker Image'
            inputs:
              command: tag
              arguments: '$(imageName):$(imageTag) $(containerRegistry)/$(imageName):$(imageTag)'

          - task: Docker@2
            displayName: 'Tag Docker Image as Latest'
            inputs:
              command: tag
              arguments: '$(imageName):latest $(containerRegistry)/$(imageName):latest'

          - script: |
              docker push $(containerRegistry)/$(imageName):$(imageTag)
              docker push $(containerRegistry)/$(imageName):latest
            displayName: 'Push Docker Images to ACR'

  - stage: Deploy
    displayName: 'Deploy to Container Apps'
    dependsOn: ContainerBuild
    condition: succeeded()
    jobs:
      - deployment: DeployApp
        displayName: 'Deploy to Azure Container Apps'
        environment: 'dev'
        strategy:
          runOnce:
            deploy:
              steps:
                - checkout: self
                  displayName: 'Checkout Code'

                - task: AzureCLI@2
                  displayName: 'Update Container App'
                  inputs:
                    azureSubscription: $(azureServiceConnection)
                    scriptType: 'bash'
                    scriptLocation: 'inlineScript'
                    inlineScript: |
                      echo "Deploying image: $(containerRegistry)/$(imageName):$(imageTag)"
                      
                      # Update container app with new image
                      az containerapp update \
                        --name $(containerAppName) \
                        --resource-group $(resourceGroup) \
                        --image $(containerRegistry)/$(imageName):$(imageTag) \
                        --output table

                - task: AzureCLI@2
                  displayName: 'Get Container App URL'
                  inputs:
                    azureSubscription: $(azureServiceConnection)
                    scriptType: 'bash'
                    scriptLocation: 'inlineScript'
                    inlineScript: |
                      FQDN=$(az containerapp show \
                        --name $(containerAppName) \
                        --resource-group $(resourceGroup) \
                        --query properties.configuration.ingress.fqdn \
                        --output tsv)
                      
                      echo "##vso[task.setvariable variable=AppUrl]https://$FQDN"
                      echo "Application deployed to: https://$FQDN"
                      echo "Health check: https://$FQDN/health"

                - script: |
                    echo "Deployment Summary:"
                    echo "==================="
                    echo "Image: $(containerRegistry)/$(imageName):$(imageTag)"
                    echo "Container App: $(containerAppName)"
                    echo "Resource Group: $(resourceGroup)"
                    echo "Application URL: $(AppUrl)"
                  displayName: 'Display Deployment Summary'
